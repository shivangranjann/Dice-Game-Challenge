<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Dicee</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Indie+Flower|Lobster" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css">


</head>

<body>

  <div class="container">
    <h1>🎲 Rolling... 🎲</h1>

    <div class="dice">
      <p>Player 1</p>
      <img class="img1" src="images/dice6.png" alt="Player 1 Dice">
    </div>

    <div class="dice">
      <p>Player 2</p>
      <img class="img2" src="images/dice6.png" alt="Player 2 Dice">
    </div>
  </div>

  <div class="reload">
    <button type="button" name="button" onclick="refresh()">
      <i class="fas fa-sync-alt"></i> Roll Again
    </button>
  </div>

  <footer>
    <p class="footer-credit">Created by Shivang Ranjan</p>
    <a href="https://github.com/shivangranjann" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-github"></i> GitHub
    </a>
    <a href="https://www.linkedin.com/in/shivangranjann" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-linkedin"></i> LinkedIn
    </a>
  </footer>

  <script src="index.js"></script>
</body>

</html>
